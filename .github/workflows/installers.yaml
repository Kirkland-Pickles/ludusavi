name: Installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            architecture: x64
            binary: ludusavi.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            platform: windows
            architecture: x86
            binary: ludusavi.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x64
            binary: ludusavi
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            architecture: arm64
            binary: ludusavi
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x64
            binary: ludusavi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-${{ matrix.target }}
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libxcb-composite0-dev libgtk-3-dev
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
            throw 'Inno Setup checksum mismatch'
          }
          $innoDir = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$innoDir`"")
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "ISCC=$innoDir\ISCC.exe" >> $env:GITHUB_ENV
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/package-installer.py ${{ matrix.platform }} target/${{ matrix.target }}/release/${{ matrix.binary }} --architecture ${{ matrix.architecture }}
      - if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        run: python tests/windows-installer.py target/${{ matrix.target }}/release/${{ matrix.binary }} "$env:ISCC" --user-data
      - if: matrix.platform == 'macos'
        run: bash tests/package-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ludusavi-installer-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ludusavi-installer-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: release-assets/*
